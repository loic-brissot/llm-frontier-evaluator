name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linter (ruff)
        run: uv run ruff check scripts tests

      - name: Run unit tests (unittest)
        run: uv run python3 -m unittest discover -s tests -v

      - name: Run unit tests (pytest)
        run: uv run pytest

      - name: Run compare_runs
        run: uv run python3 scripts/compare_runs.py

      - name: Check README comparison tables
        run: uv run python3 scripts/compare_runs.py --check-readme

      - name: Check dashboard sync
        run: uv run python3 scripts/build_dashboard.py --check

      - name: Verify frozen prompt hashes
        run: uv run python3 scripts/compare_runs.py --check-prompts
