[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-frontier-evaluator"
version = "2.15.0"
description = "Measurement standard and benchmark harness for LLM frontier evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
verify = [
    "playwright>=1.40",
]
analytics = [
    "duckdb>=1.5.6",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
verify = [
    "playwright>=1.40",
]
analytics = [
    "duckdb>=1.5.6",
    "pyarrow>=25.0.1",
]

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
    "build_dashboard",
    "compare_runs",
    "export_warehouse",
    "finish_run",
    "package_web_demos",
    "probe_data",
    "run_benchmark",
    "run_common",
    "serve_run",
    "setup_run",
    "telemetry_extraction",
    "tool_events",
    "verify_run",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
